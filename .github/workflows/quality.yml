name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade vulnerable dependencies on the review branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/valex-digital-marketing-refresh-2026-11'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          npm install --save-dev "vitest@^5.1.0" --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="Ceniv Security Bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(deps): update vulnerable tooling and lockfile"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - run: npm ci
      - name: Dependency security audit (diagnostic)
        run: |
          npm audit --json > npm-audit.json || true
          node -p "JSON.stringify({summary:require('./npm-audit.json').metadata.vulnerabilities,items:Object.entries(require('./npm-audit.json').vulnerabilities).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))})"
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-responsive-checks
          path: test-results/
          retention-days: 7
