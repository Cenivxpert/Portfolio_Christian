name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security audit (diagnostic)
        run: |
          npm audit --json > npm-audit.json || true
          node -p "JSON.stringify({summary:require('./npm-audit.json').metadata.vulnerabilities,items:Object.entries(require('./npm-audit.json').vulnerabilities).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))})"
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-responsive-checks
          path: test-results/
          retention-days: 7
