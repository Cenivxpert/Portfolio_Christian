name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security audit (diagnostic)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("npm-audit.json","utf8")); console.log("AUDIT SUMMARY", JSON.stringify(r.metadata?.vulnerabilities || {})); for(const [k,v] of Object.entries(r.vulnerabilities||{})) console.log("AUDIT ITEM", JSON.stringify({package:k,severity:v.severity,range:v.range,isDirect:v.isDirect,via:v.via,fixAvailable:v.fixAvailable}));
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-responsive-checks
          path: test-results/
          retention-days: 7
